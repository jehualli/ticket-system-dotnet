server {
    listen 80;
    root /usr/share/nginx/html;

    # The API lives in another container; the browser only ever talks to this origin.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /swagger {
        proxy_pass http://api:8080;
    }

    # Angular handles routes like /tickets/123 in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
